name: CI
on:
  pull_request:
  push:
    branches:
      - main
  # Catch changes to the upstream test vectors.
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum version in Package.swift, and a recent release.
        swift: ["6.0", "6.4"]
    container: swift:${{ matrix.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests
        run: swift test

  # Tests/UUID58Tests/vectors.json must match spec/vectors.json in
  # nakanoasaservice/uuid58.
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare with the upstream test vectors
        run: |
          curl -fsSL https://raw.githubusercontent.com/nakanoasaservice/uuid58/main/spec/vectors.json -o upstream.json
          if ! cmp -s upstream.json Tests/UUID58Tests/vectors.json; then
            echo "::error::Tests/UUID58Tests/vectors.json differs from spec/vectors.json upstream. Copy the upstream file and run the tests."
            exit 1
          fi
